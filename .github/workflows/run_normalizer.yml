name: run-normalizer
on:
  workflow_dispatch:

jobs:
  run_engine_backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Engine A & B Backtest (432 Races)
        run: |
          python3 - << 'EOF'
          import urllib.request, csv, io, json, os, re
          from collections import defaultdict

          # 1. 共通データセット（Phase 5で生成済み）の読み込み
          races = {}
          with open("dataset/common_race_dataset.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  races[row["レースコード"]] = row

          boats_by_race = defaultdict(list)
          with open("dataset/common_boat_dataset.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  boats_by_race[row["レースコード"]].append(row)

          # 2. 結果CSV (results) の取得（バックテスト専用・予想入力とは完全分離）
          dates = ["2026/11/09", "2026/11/10", "2026/11/11"]
          results_data = {}
          for d in dates:
              url = f"https://boatracecsv.github.io/data/results/{d}.csv"
              req = urllib.request.Request(url, headers={"User-Agent": "Backtest"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.status == 200:
                          r = list(csv.reader(io.StringIO(resp.read().decode("utf-8-sig"))))
                          if r:
                              headers, rows = r[0], r[1:]
                              for row in rows:
                                  d_dict = dict(zip(headers, row))
                                  rc = d_dict.get("レースコード")
                                  if rc:
                                      results_data[rc] = d_dict
              except Exception:
                  pass

          print(f"結果取得レース数: {len(results_data)} / 対象432レース")

          # 3. 既存エンジンロジック（完全無加工移植）
          EXCLUDED_STADIUMS_SOLID = ["02", "03", "04"] # 戸田, 江戸川, 平和島

          def evaluate_engine_a(race_info, b_list):
              """エンジンA：堅実イン逃げ式 (1-234-234)"""
              jcd = str(race_info.get("レース場コード", "")).zfill(2)
              if jcd in EXCLUDED_STADIUMS_SOLID:
                  return None, "イン受難水面"
              
              r1 = next((b for b in b_list if str(b["艇番"]) == "1"), None)
              r2 = next((b for b in b_list if str(b["艇番"]) == "2"), None)
              r5 = next((b for b in b_list if str(b["艇番"]) == "5"), None)
              r6 = next((b for b in b_list if str(b["艇番"]) == "6"), None)

              if not r1 or not r2 or not r5 or not r6:
                  return None, "艇データ不足"

              try:
                  r1_w = float(r1["全国勝率"])
                  r2_w = float(r2["全国勝率"])
                  r5_w = float(r5["全国勝率"]) if r5["全国勝率"] != "" else 0.0
                  r6_w = float(r6["全国勝率"]) if r6["全国勝率"] != "" else 0.0
              except ValueError:
                  return None, "勝率変換不可"

              if r1["現級別"] != "A1" or r1_w < 6.20:
                  return None, f"1号艇条件不一致({r1['現級別']}/{r1_w})"

              if (r1_w - r2_w) < 0.80:
                  return None, f"2号艇との差不足({r1_w - r2_w:.2f})"

              if r5["現級別"] in ["A1", "A2"] or r6["現級別"] in ["A1", "A2"]:
                  return None, "5・6号艇にA級存在"
              if r5_w >= 5.20 or r6_w >= 5.20:
                  return None, f"5・6号艇勝率超過({r5_w}/{r6_w})"

              # 展開指数（2〜4号艇）
              candidates = []
              inner_boats = [b for b in b_list if str(b["艇番"]) in ["2", "3", "4"]]
              st_list = [float(b["過去走平均ST_num"]) if b.get("過去走平均ST_num") not in ["", None] else 0.20 for b in inner_boats]
              min_st = min(st_list) if st_list else 0.20

              for b in inner_boats:
                  p = int(b["艇番"])
                  base_course = 3.0 if p == 2 else (2.0 if p == 3 else 1.0)
                  b_st = float(b["過去走平均ST_num"]) if b.get("過去走平均ST_num") not in ["", None] else 0.20
                  st_bonus = 1.5 if b_st == min_st else 0.0
                  w = float(b["全国勝率"]) if b["全国勝率"] != "" else 0.0
                  score = base_course + w + st_bonus
                  candidates.append({"pit": p, "score": score})

              candidates.sort(key=lambda x: x["score"], reverse=True)
              p_strong = candidates[0]["pit"]
              p_mid = candidates[1]["pit"]
              p_weak = candidates[2]["pit"]

              bets = [
                  (f"1-{p_strong}-{p_mid}", 300),
                  (f"1-{p_strong}-{p_weak}", 200),
                  (f"1-{p_mid}-{p_strong}", 200),
                  (f"1-{p_mid}-{p_weak}", 100),
                  (f"1-{p_weak}-{p_strong}", 100),
                  (f"1-{p_weak}-{p_mid}", 100)
              ]
              return {"logic": "A", "bets": bets, "total_cost": 1000}, "合格"

          def evaluate_engine_b(race_info, b_list):
              """エンジンB：リースメイ式"""
              try:
                  rno = int(race_info.get("レース回", 0))
              except ValueError:
                  return None, "レース番号不正"

              title = race_info.get("タイトル", "") + race_info.get("レース名", "")
              is_special = any(k in title for k in ["企画", "ドリーム", "準優勝", "優勝", "女子", "ヴィーナス"])
              if rno < 9 and not is_special:
                  return None, "前半一般戦除外"

              r1 = next((b for b in b_list if str(b["艇番"]) == "1"), None)
              if not r1:
                  return None, "1号艇不足"

              try:
                  r1_w = float(r1["全国勝率"])
              except ValueError:
                  return None, "1号艇勝率不正"

              if r1["現級別"] != "A1" or r1_w < 6.80:
                  return None, f"1号艇信頼度不足({r1['現級別']}/{r1_w})"

              # 外枠キーマン選定（4〜6号艇）
              outer_candidates = []
              for b in b_list:
                  if str(b["艇番"]) in ["4", "5", "6"]:
                      nw = float(b["全国勝率"]) if b["全国勝率"] != "" else 0.0
                      lw = float(b["当地勝率"]) if b["当地勝率"] != "" else 0.0
                      st = float(b["過去走平均ST_num"]) if b.get("過去走平均ST_num") not in ["", None] else 0.20
                      score = nw + (lw * 0.5) + ((0.20 - st) * 10)
                      outer_candidates.append({"pit": int(b["艇番"]), "rank": b["現級別"], "nw": nw, "lw": lw, "score": score})

              outer_candidates.sort(key=lambda x: x["score"], reverse=True)
              keyman = outer_candidates[0]

              if not (keyman["rank"] == "A1" or keyman["nw"] >= 6.50 or keyman["lw"] >= 7.00):
                  return None, "キーマン実力不足"

              k_pit = keyman["pit"]
              other_pits = [p for p in [2, 3, 4, 5, 6] if p != k_pit]

              bets = []
              for p in other_pits:
                  amt = 300 if p in [2, 3] else 200
                  bets.append((f"1-{k_pit}-{p}", amt))
                  bets.append((f"1-{p}-{k_pit}", amt))

              # 保険
              inner_boats = [b for b in b_list if str(b["艇番"]) in ["2", "3", "4"]]
              inner_sorted = sorted(inner_boats, key=lambda x: float(x["全国勝率"]) if x["全国勝率"] != "" else 0.0, reverse=True)
              best_inner = int(inner_sorted[0]["艇番"])

              bets.append((f"{best_inner}-1-{k_pit}", 200))
              bets.append((f"{best_inner}-{k_pit}-1", 200))

              total = sum(b[1] for b in bets)
              return {"logic": "B", "bets": bets, "total_cost": total}, "合格"

          # 4. バックテスト実行ループ
          def get_payout(rc, bet_str):
              res = results_data.get(rc)
              if not res:
                  return 0, False
              # 3連単の着順・払戻を取得
              comb = res.get("3連単_組番", "").replace(" ", "").strip()
              pay = res.get("3連単_払戻金", "").replace(",", "").replace("円", "").strip()
              if comb == bet_str:
                  try:
                      return int(pay), True
                  except ValueError:
                      return 0, True
              return 0, False

          stats_a = {"races": 0, "hits": 0, "cost": 0, "return": 0, "loss_streak": 0, "max_loss_streak": 0}
          stats_b = {"races": 0, "hits": 0, "cost": 0, "return": 0, "loss_streak": 0, "max_loss_streak": 0}
          
          cross_stats = {"A_only": 0, "B_only": 0, "both": 0, "neither": 0}
          by_stadium = defaultdict(lambda: {"A_races": 0, "A_hits": 0, "A_cost": 0, "A_return": 0, "B_races": 0, "B_hits": 0, "B_cost": 0, "B_return": 0})
          by_rno = defaultdict(lambda: {"A_races": 0, "A_hits": 0, "A_cost": 0, "A_return": 0, "B_races": 0, "B_hits": 0, "B_cost": 0, "B_return": 0})

          # 展示後モード（展示データ完備レース限定）集計
          exhibition_ready_rcs = set()
          for rc, b_list in boats_by_race.items():
              valid_ex = [b for b in b_list if b.get("展示タイム") not in ["", None, "UNKNOWN"]]
              if len(valid_ex) == 6:
                  exhibition_ready_rcs.add(rc)

          stats_a_post = {"races": 0, "hits": 0, "cost": 0, "return": 0}
          stats_b_post = {"races": 0, "hits": 0, "cost": 0, "return": 0}

          for rc, rinfo in races.items():
              b_list = boats_by_race[rc]
              res_a, _ = evaluate_engine_a(rinfo, b_list)
              res_b, _ = evaluate_engine_b(rinfo, b_list)

              is_a = res_a is not None
              is_b = res_b is not None

              if is_a and not is_b: cross_stats["A_only"] += 1
              elif is_b and not is_a: cross_stats["B_only"] += 1
              elif is_a and is_b: cross_stats["both"] += 1
              else: cross_stats["neither"] += 1

              stad = rinfo.get("レース場", "不明")
              rno = rinfo.get("レース回", "0")

              # エンジンA検証
              if is_a:
                  stats_a["races"] += 1
                  c = res_a["total_cost"]
                  stats_a["cost"] += c
                  by_stadium[stad]["A_races"] += 1
                  by_stadium[stad]["A_cost"] += c
                  by_rno[rno]["A_races"] += 1
                  by_rno[rno]["A_cost"] += c
                  
                  ret = 0
                  hit_any = False
                  for bet, amt in res_a["bets"]:
                      pay, hit = get_payout(rc, bet)
                      if hit:
                          ret += int(pay * (amt / 100))
                          hit_any = True
                  stats_a["return"] += ret
                  by_stadium[stad]["A_return"] += ret
                  by_rno[rno]["A_return"] += ret
                  if hit_any:
                      stats_a["hits"] += 1
                      by_stadium[stad]["A_hits"] += 1
                      by_rno[rno]["A_hits"] += 1
                      stats_a["loss_streak"] = 0
                  else:
                      stats_a["loss_streak"] += 1
                      if stats_a["loss_streak"] > stats_a["max_loss_streak"]:
                          stats_a["max_loss_streak"] = stats_a["loss_streak"]

                  if rc in exhibition_ready_rcs:
                      stats_a_post["races"] += 1
                      stats_a_post["cost"] += c
                      stats_a_post["return"] += ret
                      if hit_any: stats_a_post["hits"] += 1

              # エンジンB検証
              if is_b:
                  stats_b["races"] += 1
                  c = res_b["total_cost"]
                  stats_b["cost"] += c
                  by_stadium[stad]["B_races"] += 1
                  by_stadium[stad]["B_cost"] += c
                  by_rno[rno]["B_races"] += 1
                  by_rno[rno]["B_cost"] += c

                  ret = 0
                  hit_any = False
                  for bet, amt in res_b["bets"]:
                      pay, hit = get_payout(rc, bet)
                      if hit:
                          ret += int(pay * (amt / 100))
                          hit_any = True
                  stats_b["return"] += ret
                  by_stadium[stad]["B_return"] += ret
                  by_rno[rno]["B_return"] += ret
                  if hit_any:
                      stats_b["hits"] += 1
                      by_stadium[stad]["B_hits"] += 1
                      by_rno[rno]["B_hits"] += 1
                      stats_b["loss_streak"] = 0
                  else:
                      stats_b["loss_streak"] += 1
                      if stats_b["loss_streak"] > stats_b["max_loss_streak"]:
                          stats_b["max_loss_streak"] = stats_b["loss_streak"]

                  if rc in exhibition_ready_rcs:
                      stats_b_post["races"] += 1
                      stats_b_post["cost"] += c
                      stats_b_post["return"] += ret
                      if hit_any: stats_b_post["hits"] += 1

          # 5. レポート整形出力
          def calc_rates(s):
              r_cnt = s["races"]
              h_cnt = s["hits"]
              c = s["cost"]
              ret = s["return"]
              return {
                  "races": r_cnt,
                  "hits": h_cnt,
                  "hit_rate": round(h_cnt / r_cnt * 100, 2) if r_cnt else 0.0,
                  "total_cost": c,
                  "total_return": ret,
                  "recovery_rate": round(ret / c * 100, 2) if c else 0.0,
                  "avg_cost_per_race": round(c / r_cnt, 1) if r_cnt else 0.0,
                  "max_loss_streak": s.get("max_loss_streak", 0)
              }

          final_report = {
              "total_verified_races": len(races),
              "results_available_races": len(results_data),
              "engine_a_performance": calc_rates(stats_a),
              "engine_b_performance": calc_rates(stats_b),
              "cross_selection": cross_stats,
              "post_exhibition_ready_races": len(exhibition_ready_rcs),
              "post_exhibition_a": calc_rates(stats_a_post),
              "post_exhibition_b": calc_rates(stats_b_post),
              "by_stadium": {k: dict(v) for k, v in sorted(by_stadium.items())},
              "by_race_no": {k: dict(v) for k, v in sorted(by_rno.items(), key=lambda x: int(x[0]) if x[0].isdigit() else 99)}
          }

          print("\n=== ENGINE A & B INITIAL BACKTEST REPORT ===")
          print(json.dumps(final_report, indent=2, ensure_ascii=False))
          EOF
