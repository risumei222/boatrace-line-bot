name: run-normalizer
on:
  workflow_dispatch:

jobs:
  multi_day_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Multi-Day Reproducibility Audit
        run: |
          python3 - << 'EOF'
          import urllib.request
          import csv
          import io
          import json
          import hashlib
          import os

          os.makedirs("raw", exist_ok=True)
          os.makedirs("audit", exist_ok=True)
          os.makedirs("normalized", exist_ok=True)

          def fetch_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Reproducibility-Audit"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read()

          # 1. 2026-11-11から基準スキーマを動的生成
          _, base_t_raw = fetch_csv("https://boatracecsv.github.io/data/programs/title/2026/11/11.csv")
          _, base_c_raw = fetch_csv("https://boatracecsv.github.io/data/programs/race_cards/2026/11/11.csv")
          base_t_h = next(csv.reader(io.StringIO(base_t_raw.decode("utf-8-sig"))))
          base_c_h = next(csv.reader(io.StringIO(base_c_raw.decode("utf-8-sig"))))

          common_cols = ["レースコード", "レース日", "レース場コード", "レース回"]
          expected_columns = base_c_h + [c for c in base_t_h if c not in common_cols]
          expected_col_count = len(expected_columns)

          # スキーマを保存
          with open("schema.json", "w", encoding="utf-8") as f:
              json.dump({"columns": expected_columns, "count": expected_col_count}, f, ensure_ascii=False, indent=2)

          # 2. 検証対象日（過去2日分）
          test_dates = [
              {"date": "2026-11-09", "path": "2026/11/09"},
              {"date": "2026-11-10", "path": "2026/11/10"}
          ]

          results = {}

          for item in test_dates:
              d_str = item["date"]
              p_str = item["path"]
              d_tag = d_str.replace("-", "")

              urls = {
                  "title": f"https://boatracecsv.github.io/data/programs/title/{p_str}.csv",
                  "cards": f"https://boatracecsv.github.io/data/programs/race_cards/{p_str}.csv"
              }

              raw = {}
              status_codes = {}
              fetch_error = False

              for key, url in urls.items():
                  try:
                      status, data = fetch_csv(url)
                      status_codes[key] = status
                      raw[key] = data
                      with open(f"raw/{key}_{d_tag}.csv", "wb") as f:
                          f.write(data)
                  except Exception as e:
                      fetch_error = True
                      status_codes[key] = str(e)

              if fetch_error:
                  results[d_str] = {
                      "status": "STOP (Fetch Error)",
                      "http_status": status_codes
                  }
                  continue

              sha_t = hashlib.sha256(raw["title"]).hexdigest()
              sha_c = hashlib.sha256(raw["cards"]).hexdigest()

              t_reader = csv.reader(io.StringIO(raw["title"].decode("utf-8-sig")))
              c_reader = csv.reader(io.StringIO(raw["cards"].decode("utf-8-sig")))

              t_headers = next(t_reader)
              c_headers = next(c_reader)

              t_rows = [r for r in t_reader if r]
              c_rows = [r for r in c_reader if r]

              t_dict = {r[0]: dict(zip(t_headers, r)) for r in t_rows}
              c_dict = {r[0]: dict(zip(c_headers, r)) for r in c_rows}

              # キー検査
              t_keys = set(t_dict.keys())
              c_keys = set(c_dict.keys())
              key_set_equal = (t_keys == c_keys)
              key_dup = (len(t_rows) - len(t_keys)) + (len(c_rows) - len(c_keys))
              key_missing = len(t_keys ^ c_keys)

              # 開催場数・レース数
              tracks = set(r["レース場コード"] for r in c_dict.values())
              total_races = len(c_dict)

              # 列定義
              t_unique_cols = [c for c in t_headers if c not in common_cols]
              out_headers = c_headers + t_unique_cols
              schema_matches = (out_headers == expected_columns)

              # 結合（レース回はRACE_CARDS側の2桁表記を採用）
              merged_rows = []
              round_matches = 0
              for code in sorted(c_dict.keys()):
                  c_row = c_dict[code]
                  t_row = t_dict[code]
                  row_data = {col: c_row[col] for col in c_headers}
                  for col in t_unique_cols:
                      row_data[col] = t_row[col]
                  if row_data["レース回"] == c_row["レース回"]:
                      round_matches += 1
                  merged_rows.append(row_data)

              norm_path = f"normalized/normalized_{d_tag}.csv"
              with open(norm_path, "w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=out_headers)
                  writer.writeheader()
                  writer.writerows(merged_rows)

              is_pass = (
                  key_set_equal and
                  key_dup == 0 and
                  schema_matches and
                  round_matches == total_races and
                  len(merged_rows) == total_races and
                  len(out_headers) == expected_col_count
              )

              results[d_str] = {
                  "status": "PASS" if is_pass else "FAIL",
                  "http_status": status_codes,
                  "track_count": len(tracks),
                  "race_count": total_races,
                  "title_rows": len(t_rows),
                  "title_cols": len(t_headers),
                  "cards_rows": len(c_rows),
                  "cards_cols": len(c_headers),
                  "merged_rows": len(merged_rows),
                  "merged_cols": len(out_headers),
                  "key_set_equal": key_set_equal,
                  "key_duplicates": key_dup,
                  "key_missing": key_missing,
                  "round_matches": round_matches,
                  "schema_matches": schema_matches,
                  "sha256": {
                      "title": sha_t,
                      "cards": sha_c
                  },
                  "output_csv": norm_path
              }

              with open(f"audit/audit_{d_tag}.json", "w", encoding="utf-8") as f:
                  json.dump(results[d_str], f, ensure_ascii=False, indent=2)

          print("\n=== MULTI-DAY REPRODUCIBILITY REPORT ===")
          print(json.dumps(results, indent=2, ensure_ascii=False))
          EOF
