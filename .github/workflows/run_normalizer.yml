name: run-normalizer
on:
  workflow_dispatch:

jobs:
  probe_official_previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Official Previews Datasets
        run: |
          python3 - << 'EOF'
          import urllib.request, csv, io, json, os

          test_dates = ["2026/11/09", "2026/11/10", "2026/11/11"]
          categories = ["tkz", "stt", "sui", "original_exhibition"]

          results = {}

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Phase5D-PreviewsProbe"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status, resp.read(), None
              except urllib.error.HTTPError as e:
                  return e.code, None, str(e)
              except Exception as e:
                  return "ERROR", None, str(e)

          for cat in categories:
              results[cat] = {}
              for d in test_dates:
                  url = f"https://boatracecsv.github.io/data/previews/{cat}/{d}.csv"
                  status, body, err = fetch(url)
                  cat_res = {"url": url, "status": status}
                  if status == 200 and body:
                      cat_res["bytes"] = len(body)
                      try:
                          reader = list(csv.reader(io.StringIO(body.decode("utf-8-sig"))))
                          if reader:
                              headers = reader[0]
                              rows = reader[1:]
                              cat_res["rows"] = len(rows)
                              cat_res["cols"] = len(headers)
                              cat_res["headers"] = headers
                              cat_res["has_race_code"] = "レースコード" in headers

                              # 12桁レースコードのサンプル確認
                              if "レースコード" in headers and rows:
                                  idx = headers.index("レースコード")
                                  cat_res["sample_race_code"] = rows[0][idx] if len(rows[0]) > idx else ""

                              # 直前展示主要項目の存在と非空欄率（実測充足率）
                              target_keywords = [
                                  "展示タイム", "展示ST", "チルト", "体重", "周回", "まわり足", "直線", "進入"
                              ]
                              coverage = {}
                              for kw in target_keywords:
                                  matched_cols = [c for c in headers if kw in c]
                                  if matched_cols:
                                      for col in matched_cols:
                                          c_idx = headers.index(col)
                                          non_empty = sum(1 for r in rows if len(r) > c_idx and r[c_idx] not in ["", "-"])
                                          rate = round(non_empty / len(rows), 4) if rows else 0.0
                                          coverage[col] = {"non_empty_count": non_empty, "rate": rate}
                                  else:
                                      coverage[kw] = "NOT_FOUND"
                              cat_res["target_coverage"] = coverage
                      except Exception as parse_e:
                          cat_res["parse_error"] = str(parse_e)
                  else:
                      cat_res["error"] = err
                  results[cat][d] = cat_res

          print("\n=== PHASE 5-D PREVIEWS AUDIT REPORT ===")
          print(json.dumps(results, indent=2, ensure_ascii=False))
          EOF
