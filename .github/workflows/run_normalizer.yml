name: run-normalizer
on:
  workflow_dispatch:

jobs:
  inspect_meta_diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Meta Diff Audit
        run: |
          python3 - << 'EOF'
          import urllib.request
          import csv
          import io
          import json

          urls = {
              "title": "https://boatracecsv.github.io/data/programs/title/2026/11/11.csv",
              "cards": "https://boatracecsv.github.io/data/programs/race_cards/2026/11/11.csv"
          }

          raw = {}
          for key, url in urls.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Diff-Audit"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw[key] = resp.read()

          t_reader = csv.reader(io.StringIO(raw["title"].decode("utf-8-sig")))
          c_reader = csv.reader(io.StringIO(raw["cards"].decode("utf-8-sig")))

          t_headers = next(t_reader)
          c_headers = next(c_reader)

          t_dict = {r[0]: dict(zip(t_headers, r)) for r in t_reader if r}
          c_dict = {r[0]: dict(zip(c_headers, r)) for r in c_reader if r}

          meta_cols = ["レース日", "レース場コード", "レース回"]
          diff_results = {col: [] for col in meta_cols}

          # 144件全件走査
          for code, c_row in sorted(c_dict.items()):
              t_row = t_dict[code]
              for col in meta_cols:
                  t_val = t_row[col]
                  c_val = c_row[col]
                  if t_val != c_val:
                      diff_results[col].append({
                          "code": code,
                          "title_raw": repr(t_val),
                          "cards_raw": repr(c_val)
                      })

          print("\n=== 項目別不一致件数 ===")
          for col in meta_cols:
              print(f"{col}: {len(diff_results[col])} 件")

          print("\n=== 不一致詳細（全件一覧） ===")
          for col in meta_cols:
              if diff_results[col]:
                  print(f"\n--- 【{col}】不一致全件 ({len(diff_results[col])}件) ---")
                  for item in diff_results[col]:
                      print(f"レースコード: {item['code']} | TITLE: {item['title_raw']} | RACE_CARDS: {item['cards_raw']}")
              else:
                  print(f"\n--- 【{col}】完全一致 (0件) ---")
          EOF
