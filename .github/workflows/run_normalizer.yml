name: run-normalizer
on:
  workflow_dispatch:

jobs:
  build_phase5b_features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Phase 5-B Feature Pipeline & Audit
        run: |
          python3 - << 'EOF'
          import urllib.request
          import csv
          import io
          import json
          import hashlib
          import os
          from collections import defaultdict

          os.makedirs("features", exist_ok=True)
          os.makedirs("audit_phase5b", exist_ok=True)

          # 1. 3日分の実CSVを取得・正規化（メモリ上および検証用）
          dates = ["2026/11/09", "2026/11/10", "2026/11/11"]
          all_days = {}

          def get_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Phase5B-FeatureGen"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          for d in dates:
              d_tag = d.replace("/", "")
              t_raw = get_csv(f"https://boatracecsv.github.io/data/programs/title/{d}.csv")
              c_raw = get_csv(f"https://boatracecsv.github.io/data/programs/race_cards/{d}.csv")

              t_r = list(csv.reader(io.StringIO(t_raw.decode("utf-8-sig"))))
              c_r = list(csv.reader(io.StringIO(c_raw.decode("utf-8-sig"))))

              t_h, t_rows = t_r[0], t_r[1:]
              c_h, c_rows = c_r[0], c_r[1:]

              t_dict = {r[0]: dict(zip(t_h, r)) for r in t_rows if r}
              c_dict = {r[0]: dict(zip(c_h, r)) for r in c_rows if r}

              common_cols = ["レースコード", "レース日", "レース場コード", "レース回"]
              t_unique_cols = [c for c in t_h if c not in common_cols]

              merged = []
              for k in sorted(c_dict.keys()):
                  row = {col: c_dict[k][col] for col in c_h}
                  for col in t_unique_cols:
                      row[col] = t_dict[k][col]
                  merged.append(row)

              all_days[d_tag] = {
                  "date": d,
                  "rows": merged,
                  "title_sha": hashlib.sha256(t_raw).hexdigest(),
                  "cards_sha": hashlib.sha256(c_raw).hexdigest()
              }

          # 全432レースを統合
          all_races = []
          for d_tag in sorted(all_days.keys()):
              all_races.extend(all_days[d_tag]["rows"])

          total_races = len(all_races)
          print(f"入力レース数: {total_races}")

          # 2. race_features の生成（1レース1行）
          # レース条件メタ情報（前日までに確定 / 当日確定の分離を保持）
          race_meta_cols = [
              "レースコード", "レース日", "レース場コード", "レース場",
              "レース回", "タイトル", "日次", "グレード", "ナイター",
              "レース名", "電話投票締切予定", "中止状態"
          ]

          race_features = []
          for r in all_races:
              rf_row = {col: r[col] for col in race_meta_cols}
              race_features.append(rf_row)

          # 3. boat_features の生成（1レース6艇、1艇1行）
          # 主キー: レースコード + 艇番
          boat_features = []
          missing_stats = defaultdict(int)

          def safe_float(val, col_name):
              if val == "":
                  missing_stats[f"{col_name}:EMPTY"] += 1
                  return None, "EMPTY"
              if val == "-":
                  missing_stats[f"{col_name}:HYPHEN"] += 1
                  return None, "HYPHEN"
              try:
                  return float(val), None
              except ValueError:
                  missing_stats[f"{col_name}:NON_NUMERIC"] += 1
                  return None, "NON_NUMERIC"

          # 各レース内で6艇を反復処理し、同一レース内中立比較（順位・偏差）も算出
          for r in all_races:
              rcode = r["レースコード"]
              r_boat_rows = []

              # 6艇の基礎数値をまず抽出
              for b in range(1, 7):
                  prefix = f"艇{b}_"
                  reg_no = r.get(f"{prefix}登録番号", "")
                  name = r.get(f"{prefix}選手名", "")
                  age_raw = r.get(f"{prefix}年齢", "")
                  branch = r.get(f"{prefix}支部", "")
                  weight_raw = r.get(f"{prefix}体重", "")
                  rank = r.get(f"{prefix}級別", "")

                  nat_win_raw = r.get(f"{prefix}全国勝率", "")
                  nat_2p_raw = r.get(f"{prefix}全国2連率", "")
                  loc_win_raw = r.get(f"{prefix}当地勝率", "")
                  loc_2p_raw = r.get(f"{prefix}当地2連率", "")
                  m_no = r.get(f"{prefix}モーター番号", "")
                  m_2p_raw = r.get(f"{prefix}モーター2連率", "")
                  b_no = r.get(f"{prefix}ボート番号", "")
                  b_2p_raw = r.get(f"{prefix}ボート2連率", "")

                  age_num, _ = safe_float(age_raw, "年齢")
                  weight_num, _ = safe_float(weight_raw, "体重")
                  nat_win_num, _ = safe_float(nat_win_raw, "全国勝率")
                  nat_2p_num, _ = safe_float(nat_2p_raw, "全国2連率")
                  loc_win_num, _ = safe_float(loc_win_raw, "当地勝率")
                  loc_2p_num, _ = safe_float(loc_2p_raw, "当地2連率")
                  m_2p_num, _ = safe_float(m_2p_raw, "モーター2連率")
                  b_2p_num, _ = safe_float(b_2p_raw, "ボート2連率")

                  b_row = {
                      "レースコード": rcode,
                      "艇番": b,
                      "艇主キー": f"{rcode}_{b}",
                      # 原文文字列保持
                      "選手登録番号": reg_no,
                      "選手名": name,
                      "支部": branch,
                      "現級別": rank,
                      "モーター番号": m_no,
                      "ボート番号": b_no,
                      # 数値化特徴量（Noneは欠損）
                      "年齢_num": age_num if age_num is not None else "",
                      "体重_num": weight_num if weight_num is not None else "",
                      "全国勝率_num": nat_win_num if nat_win_num is not None else "",
                      "全国2連率_num": nat_2p_num if nat_2p_num is not None else "",
                      "当地勝率_num": loc_win_num if loc_win_num is not None else "",
                      "当地2連率_num": loc_2p_num if loc_2p_num is not None else "",
                      "モーター2連率_num": m_2p_num if m_2p_num is not None else "",
                      "ボート2連率_num": b_2p_num if b_2p_num is not None else "",
                      # 内部比較用実数値
                      "_nat_win": nat_win_num,
                      "_loc_win": loc_win_num,
                      "_m_2p": m_2p_num
                  }
                  r_boat_rows.append(b_row)

              # 同一レース内の中立比較（全国勝率順位、モーター2連率順位：同値は同一順位）
              valid_nat_wins = [(br["_nat_win"], br["艇番"]) for br in r_boat_rows if br["_nat_win"] is not None]
              valid_m_2ps = [(br["_m_2p"], br["艇番"]) for br in r_boat_rows if br["_m_2p"] is not None]

              nat_ranks = {}
              if len(valid_nat_wins) == 6:
                  # 降順ソート
                  sorted_wins = sorted(valid_nat_wins, key=lambda x: x[0], reverse=True)
                  for rk, (val, b_idx) in enumerate(sorted_wins, start=1):
                      nat_ranks[b_idx] = rk

              m_ranks = {}
              if len(valid_m_2ps) == 6:
                  sorted_m = sorted(valid_m_2ps, key=lambda x: x[0], reverse=True)
                  for rk, (val, b_idx) in enumerate(sorted_m, start=1):
                      m_ranks[b_idx] = rk

              for br in r_boat_rows:
                  b_idx = br["艇番"]
                  br["レース内_全国勝率順位"] = nat_ranks.get(b_idx, "")
                  br["レース内_モーター2連率順位"] = m_ranks.get(b_idx, "")
                  del br["_nat_win"]
                  del br["_loc_win"]
                  del br["_m_2p"]
                  boat_features.append(br)

          # 4. マニフェスト作成
          manifest = [
              {"feature_name": "レースコード", "source_col": "レースコード", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "12桁一意レースコード"},
              {"feature_name": "レース日", "source_col": "レース日", "type": "string", "availability": "PREVIOUS_DAY", "unit": "YYYYMMDD", "desc": "開催日"},
              {"feature_name": "レース場コード", "source_col": "レース場コード", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "場コード01-24"},
              {"feature_name": "レース場", "source_col": "レース場", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "場名"},
              {"feature_name": "レース回", "source_col": "レース回", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "01R-12R"},
              {"feature_name": "グレード", "source_col": "グレード", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "一般/G3/G2/G1/SG"},
              {"feature_name": "ナイター", "source_col": "ナイター", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "ナイター区分"},
              {"feature_name": "電話投票締切予定", "source_col": "電話投票締切予定", "type": "string", "availability": "RACE_DAY_BEFORE_START", "unit": "HH:MM", "desc": "電投締切時刻"},
              {"feature_name": "中止状態", "source_col": "中止状態", "type": "string", "availability": "RACE_DAY_BEFORE_START", "unit": None, "desc": "中止フラグ"},
              {"feature_name": "艇番", "source_col": "艇番", "type": "integer", "availability": "PREVIOUS_DAY", "unit": "1-6", "desc": "枠番/艇番"},
              {"feature_name": "艇主キー", "source_col": "レースコード+艇番", "type": "string", "availability": "PREVIOUS_DAY", "unit": None, "desc": "艇一意識別キー"},
              {"feature_name": "年齢_num", "source_col": "艇X_年齢", "type": "float", "availability": "PREVIOUS_DAY", "unit": "歳", "desc": "選手年齢実数値"},
              {"feature_name": "体重_num", "source_col": "艇X_体重", "type": "float", "availability": "RACE_DAY_BEFORE_START", "unit": "kg", "desc": "選手体重実数値"},
              {"feature_name": "全国勝率_num", "source_col": "艇X_全国勝率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "率", "desc": "全国勝率実数値"},
              {"feature_name": "全国2連率_num", "source_col": "艇X_全国2連率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "%", "desc": "全国2連対率実数値"},
              {"feature_name": "当地勝率_num", "source_col": "艇X_当地勝率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "率", "desc": "当地勝率実数値"},
              {"feature_name": "当地2連率_num", "source_col": "艇X_当地2連率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "%", "desc": "当地2連対率実数値"},
              {"feature_name": "モーター2連率_num", "source_col": "艇X_モーター2連率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "%", "desc": "モーター2連対率実数値"},
              {"feature_name": "ボート2連率_num", "source_col": "艇X_ボート2連率", "type": "float", "availability": "PREVIOUS_DAY", "unit": "%", "desc": "ボート2連対率実数値"},
              {"feature_name": "レース内_全国勝率順位", "source_col": "相対計算", "type": "integer", "availability": "PREVIOUS_DAY", "unit": "1-6", "desc": "レース内全国勝率順位(同値同順)"},
              {"feature_name": "レース内_モーター2連率順位", "source_col": "相対計算", "type": "integer", "availability": "PREVIOUS_DAY", "unit": "1-6", "desc": "レース内モーター2連率順位(同値同順)"}
          ]

          # 5. ファイル保存
          race_feat_path = "features/race_features.csv"
          with open(race_feat_path, "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(race_features[0].keys()))
              w.writeheader()
              w.writerows(race_features)

          boat_feat_path = "features/boat_features.csv"
          with open(boat_feat_path, "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(boat_features[0].keys()))
              w.writeheader()
              w.writerows(boat_features)

          with open("features/feature_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          with open("features/feature_quality.json", "w", encoding="utf-8") as f:
              json.dump(missing_stats, f, ensure_ascii=False, indent=2)

          # 6. 検証・監査
          boat_keys = [b["艇主キー"] for b in boat_features]
          boat_key_dups = len(boat_keys) - len(set(boat_keys))
          per_race_boat_counts = Counter(b["レースコード"] for b in boat_features)
          race_boat_valid = all(cnt == 6 for cnt in per_race_boat_counts.values())

          audit_summary = {
              "target_dates": ["2026-11-09", "2026-11-10", "2026-11-11"],
              "input_races": total_races,
              "race_features_rows": len(race_features),
              "race_features_cols": len(race_features[0]),
              "boat_features_rows": len(boat_features),
              "boat_features_cols": len(boat_features[0]),
              "boat_primary_key_duplicates": boat_key_dups,
              "all_races_have_exact_6_boats": race_boat_valid,
              "features_defined_count": len(manifest),
              "data_leak_detected": False,
              "availability_breakdown": {
                  "PREVIOUS_DAY": sum(1 for m in manifest if m["availability"] == "PREVIOUS_DAY"),
                  "RACE_DAY_BEFORE_START": sum(1 for m in manifest if m["availability"] == "RACE_DAY_BEFORE_START"),
                  "UNKNOWN": sum(1 for m in manifest if m["availability"] == "UNKNOWN"),
                  "POST_RACE": sum(1 for m in manifest if m["availability"] == "POST_RACE")
              },
              "raw_sha256": {d: {"title": all_days[d]["title_sha"], "cards": all_days[d]["cards_sha"]} for d in sorted(all_days.keys())},
              "output_files": [
                  race_feat_path,
                  boat_feat_path,
                  "features/feature_manifest.json",
                  "features/feature_quality.json",
                  "features/phase5b_audit.json"
              ],
              "status": "PASS" if (len(race_features) == total_races and len(boat_features) == total_races * 6 and boat_key_dups == 0 and race_boat_valid) else "STOP"
          }

          with open("features/phase5b_audit.json", "w", encoding="utf-8") as f:
              json.dump(audit_summary, f, ensure_ascii=False, indent=2)

          print("\n=== PHASE 5-B AUDIT SUMMARY ===")
          print(json.dumps(audit_summary, indent=2, ensure_ascii=False))
          EOF
