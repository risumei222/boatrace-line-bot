name: run-normalizer
on:
  workflow_dispatch:

jobs:
  probe_beforeinfo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Beforeinfo Data Sources
        run: |
          python3 - << 'EOF'
          import urllib.request, csv, io, json, os

          # 調査対象の日付パターン
          test_dates = ["2026/11/09", "2026/11/10", "2026/11/11"]

          # BoatraceCSVリポジトリ等で想定される直前情報パス候補
          url_patterns = [
              "https://boatracecsv.github.io/data/programs/beforeinfo/{date}.csv",
              "https://boatracecsv.github.io/data/beforeinfo/{date}.csv",
              "https://boatracecsv.github.io/data/before_info/{date}.csv",
              "https://boatracecsv.github.io/data/exhibition/{date}.csv",
              "https://boatracecsv.github.io/data/programs/exhibition/{date}.csv",
              "https://boatracecsv.github.io/data/races/beforeinfo/{date}.csv"
          ]

          probe_results = {}
          valid_csv_sample = None
          valid_url_pattern = None

          for pat in url_patterns:
              pat_res = {}
              for d in test_dates:
                  url = pat.format(date=d)
                  req = urllib.request.Request(url, headers={"User-Agent": "Phase5D-Probe"})
                  try:
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          status = resp.status
                          body = resp.read()
                          pat_res[d] = {"status": status, "bytes": len(body)}
                          if status == 200 and len(body) > 100 and valid_csv_sample is None:
                              valid_csv_sample = body
                              valid_url_pattern = pat
                  except urllib.error.HTTPError as e:
                      pat_res[d] = {"status": e.code, "error": str(e)}
                  except Exception as e:
                      pat_res[d] = {"status": "ERROR", "error": str(e)}
              probe_results[pat] = pat_res

          # 200が確認できた場合のCSV構造解析
          csv_audit = {}
          if valid_csv_sample:
              r = list(csv.reader(io.StringIO(valid_csv_sample.decode("utf-8-sig"))))
              headers = r[0] if r else []
              rows = r[1:] if len(r) > 1 else []

              # 項目網羅率チェック
              target_items = [
                  "展示タイム", "展示ST", "チルト", "周回", "まわり足", "直線",
                  "進入", "スタート展示", "レースコード", "艇番"
              ]
              found_cols = {item: [h for h in headers if item in h] for item in target_items}

              csv_audit = {
                  "confirmed_url_pattern": valid_url_pattern,
                  "total_columns": len(headers),
                  "total_rows_sample": len(rows),
                  "headers_preview": headers[:20],
                  "target_items_found": found_cols,
                  "has_race_code": "レースコード" in headers
              }

          report = {
              "http_probe": probe_results,
              "valid_url_found": valid_url_pattern is not None,
              "csv_audit": csv_audit
          }

          print("\n=== PHASE 5-D PROBE REPORT ===")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          EOF
