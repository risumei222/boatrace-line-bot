name: run-normalizer
on:
  workflow_dispatch:

jobs:
  build_phase5b_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Phase 5-B Feature Pipeline & Audit
        run: |
          python3 - << 'EOF'
          import urllib.request, csv, io, json, hashlib, os
          from collections import defaultdict, Counter

          os.makedirs("features", exist_ok=True)
          os.makedirs("audit_phase5b", exist_ok=True)

          dates = ["2026/11/09", "2026/11/10", "2026/11/11"]
          all_races = []
          raw_shas = {}

          def get_csv(url):
              req = urllib.request.Request(url, headers={"User-Agent": "P5B"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          for d in dates:
              d_tag = d.replace("/", "")
              t_raw = get_csv(f"https://boatracecsv.github.io/data/programs/title/{d}.csv")
              c_raw = get_csv(f"https://boatracecsv.github.io/data/programs/race_cards/{d}.csv")
              raw_shas[d_tag] = {"title": hashlib.sha256(t_raw).hexdigest(), "cards": hashlib.sha256(c_raw).hexdigest()}

              t_r = list(csv.reader(io.StringIO(t_raw.decode("utf-8-sig"))))
              c_r = list(csv.reader(io.StringIO(c_raw.decode("utf-8-sig"))))
              t_h, t_rows = t_r[0], t_r[1:]
              c_h, c_rows = c_r[0], c_r[1:]

              t_dict = {r[0]: dict(zip(t_h, r)) for r in t_rows if r}
              c_dict = {r[0]: dict(zip(c_h, r)) for r in c_rows if r}
              common_cols = ["レースコード", "レース日", "レース場コード", "レース回"]
              t_unique = [c for c in t_h if c not in common_cols]

              for k in sorted(c_dict.keys()):
                  row = {col: c_dict[k][col] for col in c_h}
                  for col in t_unique:
                      row[col] = t_dict[k][col]
                  all_races.append(row)

          total_races = len(all_races)
          print(f"入力レース数: {total_races}")

          # 1. race_features (1レース1行)
          race_cols = ["レースコード", "レース日", "レース場コード", "レース場", "レース回", "タイトル", "日次", "グレード", "ナイター", "レース名", "電話投票締切予定", "中止状態"]
          race_features = [{col: r[col] for col in race_cols} for r in all_races]

          # 2. boat_features (1レース6艇)
          boat_features = []
          missing_stats = defaultdict(int)

          def to_float(val, name):
              if val == "":
                  missing_stats[f"{name}:EMPTY"] += 1
                  return ""
              if val == "-":
                  missing_stats[f"{name}:HYPHEN"] += 1
                  return ""
              try:
                  return float(val)
              except ValueError:
                  missing_stats[f"{name}:NON_NUMERIC"] += 1
                  return ""

          for r in all_races:
              rc = r["レースコード"]
              r_boats = []
              for b in range(1, 7):
                  p = f"艇{b}_"
                  w_num = to_float(r.get(f"{p}全国勝率", ""), "全国勝率")
                  m_num = to_float(r.get(f"{p}モーター2連率", ""), "モーター2連率")
                  b_row = {
                      "レースコード": rc, "艇番": b, "艇主キー": f"{rc}_{b}",
                      "選手名": r.get(f"{p}選手名", ""), "級別": r.get(f"{p}級別", ""),
                      "年齢_num": to_float(r.get(f"{p}年齢", ""), "年齢"),
                      "体重_num": to_float(r.get(f"{p}体重", ""), "体重"),
                      "全国勝率_num": w_num, "モーター2連率_num": m_num,
                      "_w": w_num if isinstance(w_num, float) else -1.0,
                      "_m": m_num if isinstance(m_num, float) else -1.0
                  }
                  r_boats.append(b_row)

              # 同一レース内順位 (中立比較)
              w_ranks = sorted(range(6), key=lambda i: r_boats[i]["_w"], reverse=True)
              m_ranks = sorted(range(6), key=lambda i: r_boats[i]["_m"], reverse=True)
              for rank, idx in enumerate(w_ranks, 1):
                  r_boats[idx]["レース内_全国勝率順位"] = rank if r_boats[idx]["_w"] >= 0 else ""
              for rank, idx in enumerate(m_ranks, 1):
                  r_boats[idx]["レース内_モーター2連率順位"] = rank if r_boats[idx]["_m"] >= 0 else ""

              for b_row in r_boats:
                  del b_row["_w"]
                  del b_row["_m"]
                  boat_features.append(b_row)

          # 3. CSV保存
          with open("features/race_features.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(race_features[0].keys()))
              w.writeheader()
              w.writerows(race_features)

          with open("features/boat_features.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(boat_features[0].keys()))
              w.writeheader()
              w.writerows(boat_features)

          # 4. 検証と監査サマリー
          boat_keys = [b["艇主キー"] for b in boat_features]
          boat_dups = len(boat_keys) - len(set(boat_keys))
          per_race_counts = Counter(b["レースコード"] for b in boat_features)
          race_6_valid = all(cnt == 6 for cnt in per_race_counts.values())

          audit = {
              "target_dates": ["2026-11-09", "2026-11-10", "2026-11-11"],
              "input_races": total_races,
              "race_features_rows": len(race_features),
              "race_features_cols": len(race_features[0]),
              "boat_features_rows": len(boat_features),
              "boat_features_cols": len(boat_features[0]),
              "boat_primary_key_duplicates": boat_dups,
              "all_races_have_exact_6_boats": race_6_valid,
              "raw_sha256": raw_shas,
              "missing_stats": dict(missing_stats),
              "status": "PASS" if (len(race_features) == total_races and len(boat_features) == total_races * 6 and boat_dups == 0 and race_6_valid) else "STOP"
          }

          with open("features/phase5b_audit.json", "w", encoding="utf-8") as f:
              json.dump(audit, f, ensure_ascii=False, indent=2)

          print("\n=== PHASE 5-B AUDIT SUMMARY ===")
          print(json.dumps(audit, indent=2, ensure_ascii=False))
          EOF
