name: Build Boatrace Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install lhafile
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and Parse Boatrace Data
        run: |
          python - << 'EOF'
          import json
          import urllib.request
          from pathlib import Path
          import lhafile

          lzh_dir = Path("bk_lzh")
          lzh_dir.mkdir(exist_ok=True)

          # 2026年11月1日〜24日分のデータを取得
          dates = [f"2611{d:02d}" for d in range(1, 25)]
          dataset = []

          def read_lzh_text(lzh_path):
              lf = lhafile.Lhafile(str(lzh_path))
              for info in lf.infolist():
                  if info.filename.lower().endswith(".txt"):
                      return lf.read(info.filename).decode("cp932", errors="ignore")
              return ""

          for d in dates:
              ym = "20" + d[:4]
              texts = {}
              for kind in ["b", "k"]:
                  fname = f"{kind}{d}.lzh"
                  lzh_path = lzh_dir / fname
                  url = f"https://www1.mbrace.or.jp/od2/{kind.upper()}/{ym}/{fname}"
                  try:
                      urllib.request.urlretrieve(url, lzh_path)
                      texts[kind] = read_lzh_text(lzh_path)
                  except Exception as e:
                      print(f"Skip {fname}: {e}")

              if texts.get("b") and texts.get("k"):
                  dataset.append({
                      "date": f"20{d[:2]}-{d[2:4]}-{d[4:6]}",
                      "code": d,
                      "b_lines": len(texts["b"].splitlines()),
                      "k_lines": len(texts["k"].splitlines()),
                      "b_text": texts["b"],
                      "k_text": texts["k"],
                  })

          Path("auto_dataset.json").write_text(
              json.dumps(dataset, ensure_ascii=False),
              encoding="utf-8"
          )
          print(f"auto_dataset.json saved: {len(dataset)} days")
          EOF

      - name: Commit and Push auto_dataset.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_dataset.json
          git diff --cached --quiet || git commit -m "Update auto_dataset.json"
          git push
