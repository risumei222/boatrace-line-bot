name: Build Boatrace Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y lhasa
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and Parse Boatrace Data
        run: |
          python - << 'EOF'
          import inspect
          import json
          import subprocess
          import urllib.request
          from pathlib import Path
          from backtest_lab.parse_b import parse_b_bytes
          from backtest_lab.parse_k_results import parse_k_results_bytes
          import backtest_lab.build_dataset as bd

          raw_dir = Path("bk_raw")
          lzh_dir = Path("bk_lzh")
          raw_dir.mkdir(exist_ok=True)
          lzh_dir.mkdir(exist_ok=True)

          dates = [f"2611{d:02d}" for d in range(10, 22)]
          b_docs, k_docs = [], []

          for d in dates:
              ym = "20" + d[:4]
              for kind in ["b", "k"]:
                  fname = f"{kind}{d}.lzh"
                  lzh_path = lzh_dir / fname
                  url = f"http://www1.mbrace.or.jp/od2/{kind.upper()}/{ym}/{fname}"
                  try:
                      urllib.request.urlretrieve(url, lzh_path)
                      subprocess.run(["lha", "xw=" + str(raw_dir), str(lzh_path)], check=True)
                  except Exception as e:
                      print(f"Skip {fname}: {e}")

              b_txt = raw_dir / f"B{d}.TXT"
              k_txt = raw_dir / f"K{d}.TXT"
              if b_txt.exists() and k_txt.exists():
                  b_docs.append(parse_b_bytes(b_txt.read_bytes()))
                  k_docs.append(parse_k_results_bytes(k_txt.read_bytes()))

          fn = bd.build_backtest_dataset
          params = list(inspect.signature(fn).parameters.keys())
          dataset = fn(b_docs, k_docs) if len(params) >= 2 else fn(raw_dir)

          Path("auto_dataset.json").write_text(
              json.dumps(dataset, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("auto_dataset.json saved successfully.")
          EOF

      - name: Commit and Push auto_dataset.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_dataset.json
          git diff --cached --quiet || git commit -m "Update auto_dataset.json"
          git push

