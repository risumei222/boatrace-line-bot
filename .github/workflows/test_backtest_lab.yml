name: Test Backtest Lab Parser

on:
  workflow_dispatch:

jobs:
  run-audit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run K Parser and SQLite Audit Test
        run: |
          python - << 'EOF'
          import sqlite3

          # 正常10行＋F1行のサンプルデータ（CP932）
          samples = [
              ("01 1 4444 峰  竜太   52 35 6.75  1  .12      1.48.5", 1, "4444", 1, 0.12, 0),
              ("02 2 4445 毒島  誠   12 18 6.78  2  .15      1.49.2", 2, "4445", 2, 0.15, 0),
              ("03 3 4446 平本真之   33 22 6.80  3  .18      1.50.1", 3, "4446", 3, 0.18, 0),
              ("04 4 4447 茅原悠紀   41 40 6.72  4  .10      1.51.0", 4, "4447", 4, 0.10, 0),
              ("05 5 4448 白井英治   60 55 6.82  5  .20      1.52.3", 5, "4448", 5, 0.20, 0),
              ("06 6 4449 西山貴浩   15 11 6.79  6  .14      1.53.1", 6, "4449", 6, 0.14, 0),
              ("01 1 3897 瓜生正義   23 45 6.71  1  .08      1.47.9", 1, "3897", 1, 0.08, 0),
              ("02 2 4320 峰竜太２   11 19 6.74  2  .11      1.48.8", 2, "4320", 2, 0.11, 0),
              ("03 3 4024 井口佳典   34 31 6.77  3  .16      1.49.5", 3, "4024", 3, 0.16, 0),
              ("04 4 4238 毒島誠２   45 42 6.73  4  .13      1.50.4", 4, "4238", 4, 0.13, 0),
              ("F  6 4500 山田太郎   18 14 6.79  6 F.02            ", 6, "4500", 6, -0.02, 1)
          ]

          print("=== 16進ダンプ & スライス照合実測 ===")
          for idx, (raw_str, exp_slot, exp_reg, exp_course, exp_st, exp_f) in enumerate(samples, 1):
              b = raw_str.encode('cp932')
              course_bytes = b[33:34]
              st_bytes = b[35:40]
              
              course_str = course_bytes.decode('cp932', errors='ignore').strip()
              st_str = st_bytes.decode('cp932', errors='ignore').strip()
              
              # STパース
              is_f = 1 if st_str.startswith('F') else 0
              if is_f:
                  st_val = -round(float(st_str.replace('F', '0')), 2)
              else:
                  st_val = round(float(st_str), 2)
                  
              print(f"[{idx:02d}] hex(course)={course_bytes.hex()} -> '{course_str}' | hex(st)={st_bytes.hex()} -> '{st_str}' (val={st_val}, is_f={is_f})")
              
              # アサート検証
              assert int(course_str) == exp_course, f"Course mismatch at row {idx}"
              assert st_val == exp_st, f"ST mismatch at row {idx}"
              assert is_f == exp_f, f"F flag mismatch at row {idx}"

          print("\n=== PASS: 全11行（正常10行＋F1行）のスライス実測完全一致 ===")
          print("進入コース [33:34] および ST [35:40] の正確性を確認しました。")
          EOF
