name: Test Backtest Lab Parser

on:
  workflow_dispatch:

jobs:
  verify-k-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test/backtest-lab
        uses: actions/checkout@v4
        with:
          ref: test/backtest-lab
          fetch-depth: 0

      - name: Safety Check
        run: |
          echo "=== 1. BRANCH & HEAD ==="
          BRANCH=$(git branch --show-current)
          echo "CURRENT_BRANCH: $BRANCH"
          echo "HEAD_COMMIT: $(git rev-parse HEAD)"
          if [ "$BRANCH" != "test/backtest-lab" ]; then
            echo "ABORT: Not on test/backtest-lab"
            exit 1
          fi
          echo "=== 2. DIFF AGAINST MAIN ==="
          git fetch origin main
          git diff --name-status origin/main...HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install lhafile

      - name: Run Unit Tests
        run: python -m unittest discover -s backtest_lab -p "test_*.py" -v

      - name: Run Real Data Re-Audit
        run: |
          python - << 'EOF'
          import urllib.request
          import lhafile
          import hashlib
          import json
          import re
          from backtest_lab.parse_k import parse_k_bytes

          targets = [
              ("2026-11-10", "k261110.lzh", "https://www1.mbrace.or.jp/od2/K/202611/k261110.lzh", "888cd68f92b1a9f24bdb8ff05f9a16f215d2d5fd640b6d813334f4547296c418"),
              ("2025-11-12", "k251112.lzh", "https://www1.mbrace.or.jp/od2/K/202511/k251112.lzh", "73d38e35af1305d13e73c3094b8888a8f391050c8ee88b743306dc09eddc904f"),
          ]

          for dt, fname, url, expected_sha in targets:
              print(f"\n==================== {dt} ({fname}) ====================")
              path = f"/tmp/{fname}"
              urllib.request.urlretrieve(url, path)
              with open(path, "rb") as f:
                  actual_sha = hashlib.sha256(f.read()).hexdigest()
              print(f"EXPECTED_SHA256 : {expected_sha}")
              print(f"ACTUAL_SHA256   : {actual_sha}")
              print(f"SHA256_MATCH    : {expected_sha == actual_sha}")
              if expected_sha != actual_sha:
                  raise RuntimeError("SHA-256 mismatch!")

              lf = lhafile.Lhafile(path)
              raw = None
              for info in lf.infolist():
                  if info.filename.lower().endswith(".txt"):
                      raw = lf.read(info.filename)
                      break

              res = parse_k_bytes(raw)
              races = res["races"]
              anomalies = res["anomalies"]

              # 距離集計
              h1200_count = 0
              h1800_count = 0
              other_dist = []
              for r in races:
                  m = re.search(r"H(\d+)m", r["headerRaw"], re.IGNORECASE)
                  d = m.group(1) if m else "UNKNOWN"
                  if d == "1200":
                      h1200_count += 1
                  elif d == "1800":
                      h1800_count += 1
                  else:
                      other_dist.append((r["raceId"], r["headerRaw"]))

              total_racers = sum(r["racerCount"] for r in races)
              six_races = sum(1 for r in races if r["racerCount"] == 6)
              le5_races = [r for r in races if r["racerCount"] <= 5]
              ge7_races = [r for r in races if r["racerCount"] >= 7]
              dup_boats = [r for r in races if r["duplicateBoatNos"]]
              unknown_course_racers = [
                  {"raceId": r["raceId"], "boatNo": rc["boatNo"], "racerNo": rc["racerNo"], "racerName": rc["racerName"], "rankRaw": rc["rankRaw"], "entryCourse": rc["entryCourse"], "entryCourseRaw": rc["entryCourseRaw"]}
                  for r in races for rc in r["racers"] if rc["entryCourse"] is None
              ]
              other_lines_total = sum(len(r["otherLines"]) for r in races)

              print(f"1.  TOTAL_LINES          : {res['sourceLineCount']}")
              print(f"2.  RACE_COUNT           : {res['raceCount']}")
              print(f"3.  H1200M_RACE_COUNT    : {h1200_count}")
              print(f"4.  H1800M_RACE_COUNT    : {h1800_count}")
              print(f"5.  OTHER_DIST_COUNT     : {len(other_dist)} {other_dist}")
              print(f"6.  TOTAL_RACER_ROWS     : {total_racers}")
              print(f"7.  SIX_RACER_RACES      : {six_races}")
              print(f"8.  LE5_RACER_RACES      : {len(le5_races)} {[(r['raceId'], r['racerCount']) for r in le5_races]}")
              print(f"9.  GE7_RACER_RACES      : {len(ge7_races)} {[(r['raceId'], r['racerCount']) for r in ge7_races]}")
              print(f"10. DUP_BOAT_COUNT       : {len(dup_boats)}")
              print(f"11. UNKNOWN_COURSE_COUNT : {len(unknown_course_racers)}")
              print("    UNKNOWN_COURSE_DETAIL:", json.dumps(unknown_course_racers, ensure_ascii=False))
              print(f"12. OTHER_LINES_TOTAL    : {other_lines_total}")
              print(f"13. ANOMALY_COUNT        : {res['anomalyCount']}")
              print("    ANOMALIES_ALL        :", json.dumps(anomalies, ensure_ascii=False))

              if dt == "2026-11-10":
                  print("\n--- [2026-11-10] 890/911/932行付近のH1200m分割確認 ---")
                  for r in races:
                      if r["headerLineNumber"] in (869, 890, 911, 932) or "H1200m" in r["headerRaw"]:
                          if r["headerLineNumber"] <= 960:
                              print(f"line={r['headerLineNumber']} | raceId={r['raceId']} | racerCount={r['racerCount']} | dup={r['duplicateBoatNos']} | header={r['headerRaw']}")

                  print("\n--- [2026-11-10] 福岡(22) 1R 照合 ---")
                  for r in races:
                      if r["raceId"] == "20261110_22_01":
                          for rc in r["racers"]:
                              print(json.dumps({k: v for k, v in rc.items() if k != "rawHex"}, ensure_ascii=False))

              if dt == "2025-11-12":
                  print("\n--- [2025-11-12] 芦屋(21) 2R 照合 (S0/S2確認) ---")
                  for r in races:
                      if r["raceId"] == "20251112_21_02":
                          for rc in r["racers"]:
                              print(json.dumps({k: v for k, v in rc.items() if k != "rawHex"}, ensure_ascii=False))
          EOF
