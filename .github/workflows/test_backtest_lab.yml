name: Test Backtest Lab Parser

on:
  workflow_dispatch:

jobs:
  run-audit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install lhafile urllib3

      - name: Inspect K-File Header Format
        run: |
          python - << 'EOF'
          import urllib.request
          import lhafile
          import re

          target_dates = [("2026-11-10", "261110"), ("2025-11-12", "251112")]

          for f_date, yymmdd in target_dates:
              lzh_name = f"k{yymmdd}.lzh"
              url = f"https://www1.mbrace.or.jp/od2/K/20{yymmdd[:4]}/k{yymmdd}.lzh"
              print(f"\n==================== {f_date} ({lzh_name}) ====================")
              urllib.request.urlretrieve(url, lzh_path := f"/tmp/{lzh_name}")
              lf = lhafile.Lhafile(lzh_path)
              raw_bytes = None
              for info in lf.infolist():
                  if info.filename.lower().endswith('.txt'):
                      raw_bytes = lf.read(info.filename)
                      break
              
              lines = raw_bytes.splitlines()
              print(f"Total Lines: {len(lines)}")
              
              print("\n--- FIRST 35 LINES SAMPLE ---")
              for i in range(min(35, len(lines))):
                  lb = lines[i]
                  text = lb.decode('cp932', errors='replace')
                  if any(keyword in text for keyword in ["R", "桐生", "戸田", "競走成績", "ボート"]):
                      print(f"L{i+1:03d} (len={len(lb):02d}): {text}")
                      if "1R" in text or "01#" in text or "桐生" in text:
                          print(f"     HEX: {lb[:40].hex()}")

              # ヘッダー候補行のカウント
              r_pattern_count = sum(1 for l in lines if re.search(r'\d{1,2}R', l.decode('cp932', errors='ignore')))
              venue_pattern_count = sum(1 for l in lines if re.search(r'\d{2}#', l.decode('cp932', errors='ignore')))
              print(f"\nHeader Counts -> Lines with '..R': {r_pattern_count}, Lines with '..#': {venue_pattern_count}")

          print("\n=== INSPECTION COMPLETED ===")
          EOF
